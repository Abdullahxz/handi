name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: abdullahxz
  ALPINE_VERSION: "3.24.1"
  PG_MAJOR: "17"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfiles and shell scripts
        run: make lint

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Verify the vendored Alpine rootfs
        run: make verify

      - name: Build all images
        run: make all TAG=${{ github.sha }}

      - name: Scan for fixable HIGH/CRITICAL vulnerabilities
        run: make scan TAG=${{ github.sha }}

      - name: Generate SBOMs
        run: make sbom TAG=${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: sboms-${{ github.sha }}
          path: dist/
          retention-days: 90

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push with SBOM and provenance attestations
        if: github.event_name != 'pull_request'
        run: make push TAG=${{ github.sha }}

      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'

      - name: Sign published images by digest
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          images=(
            "${REGISTRY}/alpine:${ALPINE_VERSION}"
            "${REGISTRY}/netshoot:${{ github.sha }}"
            "${REGISTRY}/netshoot:${{ github.sha }}-full"
            "${REGISTRY}/psql:${PG_MAJOR}-${{ github.sha }}"
          )
          for img in "${images[@]}"; do
            digest="$(docker buildx imagetools inspect "$img" --format '{{.Manifest.Digest}}')"
            echo ">> signing ${img%:*}@${digest}"
            cosign sign --yes "${img%:*}@${digest}"
          done
