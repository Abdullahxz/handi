name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: abdullahxz
  STAGING: ghcr.io/abdullahxz/handi
  ALPINE_VERSION: "3.24.1"
  PG_MAJOR: "17"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfiles and shell scripts
        run: make lint

  pull-request:
    if: github.event_name == 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify the vendored Alpine rootfs
        run: make verify

      - name: Build all images
        run: make all TAG=pr-${{ github.event.pull_request.number }}

      - name: Scan for fixable HIGH/CRITICAL vulnerabilities
        run: make scan TAG=pr-${{ github.event.pull_request.number }}

  release:
    if: github.event_name != 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Verify the vendored Alpine rootfs
        run: make verify

      - name: Log in to the staging registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to staging
        run: make stage TAG=${{ github.sha }}

      - name: Scan staged digests
        run: make scan-staged TAG=${{ github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote scanned digests
        run: make promote TAG=${{ github.sha }}

      - uses: sigstore/cosign-installer@v3

      - name: Sign published digests
        run: |
          set -euo pipefail
          images=(
            "${REGISTRY}/alpine:${ALPINE_VERSION}"
            "${REGISTRY}/netshoot:${{ github.sha }}"
            "${REGISTRY}/netshoot:${{ github.sha }}-full"
            "${REGISTRY}/psql:${PG_MAJOR}-${{ github.sha }}"
          )
          for img in "${images[@]}"; do
            digest="$(docker buildx imagetools inspect "$img" --format '{{.Manifest.Digest}}')"
            echo ">> signing ${img%:*}@${digest}"
            cosign sign --yes "${img%:*}@${digest}"
          done

      - name: Delete staging images
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GHCR_CLEANUP_TOKEN not set; staging images left in place."
            echo "Deleting user-scoped packages needs a PAT with delete:packages;"
            echo "GITHUB_TOKEN cannot do it."
            exit 0
          fi
          for pkg in alpine netshoot psql; do
            enc="handi%2F${pkg}"
            ids="$(gh api "/user/packages/container/${enc}/versions" \
                     --jq '.[] | select(.metadata.container.tags[]? | contains("${{ github.sha }}")) | .id' \
                   || true)"
            for id in $ids; do
              echo ">> deleting ${pkg} version ${id}"
              gh api -X DELETE "/user/packages/container/${enc}/versions/${id}"
            done
          done
